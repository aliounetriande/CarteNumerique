<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <style>
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fff8f0, #fce4d6);
        }

        .phone {
            width: 360px;
            height: 640px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 8px solid #dd855f;
        }

        .content {
            width: 90%;
            text-align: center;
        }

        .content h1 {
            font-size: 30px;
            color: #dd855f;
            margin-bottom: 5px;
        }

        .content p {
            font-size: 20px;
            color: #a05a3b;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .envelope {
            width: 240px;
            height: 160px;
            background: #dd855f;
            border-radius: 10px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seal {
            width: 60px;
            height: 60px;
            background: #fff8f0;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #dd855f;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .seal a {
            text-decoration: none;
            color: #dd855f;
            position: relative;
        }

        .click-text {
            font-size: 14px;
            font-weight: bold;
            color: black;
            animation: blink 1.2s infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="content">
            <h1>Invitation au mariage du couple PAFADNAM</h1>
            <p>15-16 Février 2025</p>
            <div class="envelope">
                <div class="seal">
                    <a href="https://invitationcouplepafadnam.my.canva.site/">❤<span class="click-text">Cliquez-moi</span></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
