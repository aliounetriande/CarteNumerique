<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Malika & Kader</title>
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #d9d9d9, #bfbfbf);
        }

        .phone {
            width: 360px;
            height: 640px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            width: 90%;
            text-align: center;
        }

        .content h1 {
            font-size: 32px;
            color: #4d4d4d;
            margin-bottom: 5px;
        }

        .content p {
            font-size: 18px;
            color: #666666;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .envelope {
            width: 220px;
            height: 140px;
            background: #a6a6a6;
            border-radius: 10px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #b3b3b3, #a6a6a6);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .seal {
            width: 50px;
            height: 50px;
            background: #ff5733;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .blink-text {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #4d4d4d;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="content">
            <h1>Malika & Kader</h1>
            <p>15 Février 2025 | 17:00</p>
            <a href="https://fortunas.my.canva.site/exemple-1-carte-d-invitation" target="_blank">
                <div class="envelope">
                    <div class="seal">❤</div>
                </div>
            </a>
            <p class="blink-text">Cliquez moi</p>
        </div>
    </div>
</body>
</html>
